[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-listing-monitor"
version = "0.1.0"
description = "Personal-use listing monitor using headed Playwright, SQLite, YAML config, and Gmail OAuth."
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.130.0",
  "google-auth>=2.29.0",
  "google-auth-oauthlib>=1.2.0",
  "playwright>=1.44.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.1",
]

[project.scripts]
listing-monitor = "listing_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
