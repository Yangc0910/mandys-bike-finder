<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Mandy's Bike Finder - Offline</title>
    <style>
      :root {
        color: #0f172a;
        background: #f5f7fb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding:
          max(32px, env(safe-area-inset-top))
          24px
          max(32px, env(safe-area-inset-bottom));
      }

      main {
        width: min(100%, 420px);
        padding: 32px 24px;
        border: 1px solid #dbe4f0;
        border-radius: 28px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgb(15 23 42 / 8%);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #2563eb;
        font-size: 14px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      p {
        margin: 16px 0 0;
        color: #475569;
        font-size: 17px;
        line-height: 1.55;
      }

      .note {
        margin-top: 20px;
        padding: 14px;
        border-radius: 16px;
        background: #eff6ff;
        color: #1e3a5f;
        font-size: 15px;
      }

      a {
        display: block;
        margin-top: 24px;
        min-height: 48px;
        padding: 14px 18px;
        border-radius: 16px;
        background: #2563eb;
        color: #ffffff;
        font-size: 17px;
        font-weight: 700;
        line-height: 20px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./icon.svg" alt="" />
      <p class="eyebrow">You're offline</p>
      <h1>Mandy's Bike Finder can't connect</h1>
      <p>Reconnect to the internet, then try opening the app again.</p>
      <p class="note">AI screenshot extraction and other server actions need a connection.</p>
      <a href="https://app.mandysbikefinder.com">Try again</a>
    </main>
  </body>
</html>
